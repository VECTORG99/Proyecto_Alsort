name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Create .env for tests
        run: |
          echo "SPOTIFY_CLIENT_ID=test-client-id" >> backend/.env
          echo "SPOTIFY_CLIENT_SECRET=test-client-secret" >> backend/.env
          echo "SESSION_SECRET=$(python3 -c 'import secrets; print(secrets.token_hex(32))')" >> backend/.env

      - name: Run tests with coverage
        run: |
          cd backend && python -m pytest --tb=short --cov=app --cov-report=term-missing --cov-report=html:coverage_html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage_html/

      - name: Test summary
        run: |
          cd backend && python -m pytest --co 2>/dev/null || true
          echo "---"
          echo "Test files: $(find tests/ -name '*.py' -not -name '__init__.py' | wc -l)"
          echo "Total tests: $(cd backend && python -m pytest --collect-only -q 2>&1 | tail -1 || echo 'N/A')"

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend && npm ci

      - name: Type-check
        run: |
          cd frontend && npx tsc --noEmit

      - name: Build
        run: |
          cd frontend && npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t alsort-backend -f Dockerfile.backend .

      - name: Build frontend image
        run: docker build -t alsort-frontend -f Dockerfile.frontend .
