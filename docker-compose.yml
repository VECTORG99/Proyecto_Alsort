services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: alsort-backend
    # Exponer solo en desarrollo. En producción, backend debe ser interno.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - backend/.env
    volumes:
      - alsort-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - alsort-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: alsort-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alsort-net

volumes:
  alsort-data:

networks:
  alsort-net:
    driver: bridge
